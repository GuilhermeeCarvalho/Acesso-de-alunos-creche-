spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/creche}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_secure_2024}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://gerenciador-de-acesso-eight.vercel.app,https://gerenciador-de-acesso-e30osu1ol-sandriely-maciel-s-projects.vercel.app}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB